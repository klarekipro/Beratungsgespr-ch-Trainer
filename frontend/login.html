<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Klare KI</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/portals.css"><link rel="stylesheet" href="/static/appearance.css"><link rel="stylesheet" href="/static/header_menus.css"><script src="/static/i18n.js" defer></script><script src="/static/header_menus.js" defer></script><script src="/static/login.js" defer></script></head><body class="login-body"><main class="card login-card"><div class="brand-text">klare ki</div><p class="eyebrow">Beratungsgespräch-Trainer</p><h1 data-i18n="auth.login.title">Anmelden</h1><form id="login-form" method="post" autocomplete="on"><label for="portal" data-i18n="auth.login.portal">Portal</label><select id="portal"><option value="learner" data-i18n="auth.role.employee">Mitarbeitende</option><option value="mentor" data-i18n="auth.role.mentor">Mentor</option></select><label for="username" data-i18n="auth.login.username">Benutzername</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64"><label for="password" data-i18n="auth.login.password">Passwort</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button id="password-toggle" class="btn small-btn" type="button" aria-controls="password" aria-pressed="false" data-i18n="auth.login.show">Passwort anzeigen</button><p class="caption" data-i18n="auth.login.hidden">Das Passwort ist verdeckt. Die automatische Eingabe hängt vom Passwortmanager ab.</p><p id="login-error" class="form-error" role="alert"></p><button id="login-submit" class="btn primary" type="submit" data-i18n="auth.login.submit">Anmelden</button></form><p id="setup-help" class="caption"></p><p class="caption" data-i18n="auth.login.privacy">Mitarbeitende sehen nur ihre eigenen Trainings. Konten werden vom Mentor erstellt.</p></main></body></html>
